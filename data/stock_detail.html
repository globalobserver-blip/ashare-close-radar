<style>
  :root{--ink:#172b38;--muted:#71808a;--line:#dce1db;--paper:#f5f5f0;--card:#fffefa;--up:#d95742;--down:#08756f;--ma5:#d99a26;--ma20:#5c78a8;--ma30:#815f9d}*{box-sizing:border-box}body{margin:0;padding:28px;background:var(--paper);color:var(--ink);font:15px 'Microsoft YaHei','Times New Roman',sans-serif}.page{max-width:1180px;margin:auto}.back{color:var(--down);text-decoration:none;font-size:14px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin:18px 0}.eyebrow{font:11px 'Times New Roman';letter-spacing:1.3px;color:var(--muted)}h1{margin:4px 0;font-size:30px}.code{font:13px 'Times New Roman';color:var(--muted);margin-left:8px}.quote{font:25px 'Times New Roman';font-weight:700}.up{color:var(--up)}.down{color:var(--down)}.card{background:var(--card);border:1px solid var(--line);border-radius:6px}.chart-card{padding:20px}.chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.chart-head h2{font-size:18px;margin:0}.chart-head small{color:var(--muted)}.chart-tools{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:0 0 12px}.chart-tools span{font-size:12px;color:var(--muted);margin-right:3px}.zoom{border:1px solid var(--line);background:#fffefa;color:var(--muted);border-radius:4px;padding:5px 9px;font:12px 'Microsoft YaHei';cursor:pointer}.zoom:hover,.zoom.active{background:var(--ink);border-color:var(--ink);color:#fff}.ma-legend{margin-left:auto;display:flex;gap:12px;font:12px 'Times New Roman';color:var(--muted)}.ma-legend b{font-weight:700}.ma5{color:var(--ma5)}.ma20{color:var(--ma20)}.ma30{color:var(--ma30)}.chart-mount{position:relative;outline:none}.chart-mount:focus-visible{box-shadow:0 0 0 2px #8db7af}.wheel-hint{position:absolute;right:10px;bottom:8px;background:rgba(255,254,250,.9);color:var(--muted);font-size:11px;padding:3px 6px;border-radius:3px;pointer-events:none;opacity:.72}svg{display:block;width:100%;height:350px;background:#fffefa;border-top:1px solid #edf0eb;border-bottom:1px solid #edf0eb}.grid{stroke:#e6e9e4;stroke-width:1}.wick{stroke-width:1.2}.candle-up{fill:var(--up);stroke:var(--up)}.candle-down{fill:var(--down);stroke:var(--down)}.ma-line{fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}.line-ma5{stroke:var(--ma5)}.line-ma20{stroke:var(--ma20)}.line-ma30{stroke:var(--ma30)}.axis{fill:#7b858b;font-size:11px}.stats{display:grid;grid-template-columns:repeat(5,1fr);margin-top:14px}.stats div{padding:12px 15px;border-right:1px solid var(--line)}.stats div:last-child{border:0}.stats span{display:block;color:var(--muted);font-size:12px}.stats b{display:block;margin-top:7px;font-size:16px}.history{margin-top:18px;padding:18px}.history h2{font-size:17px;margin:0 0 10px}table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:10px;border-top:1px solid #e7eae5;font-size:13px}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:500}.watch{padding:9px 13px;border:1px solid var(--line);background:#fff;border-radius:4px;color:var(--down);cursor:pointer}@media(max-width:700px){body{padding:16px}.stats{grid-template-columns:repeat(2,1fr)}.stats div{border-bottom:1px solid var(--line)}svg{height:250px}.head{align-items:start;flex-direction:column}.ma-legend{margin:4px 0 0;width:100%}.wheel-hint{display:none}}

<body><header class="detail-nav"><a class="detail-brand" href="../index.html#market"><i>R.</i><span>收盘雷达 <small>A-SHARE · DAILY CLOSE</small></span></a><nav aria-label="主导航"><a href="../index.html#market">市场</a><a class="active" href="../index.html#all-stocks">个股扫描</a><a href="../index.html#disclosures">公告研报</a><a href="../index.html#my-watchlist">自选</a></nav><span class="nav-status">A 股 · 收盘后数据</span></header><main class="page"><button class="back" id="backButton" type="button">← 返回上一级</button><section id="app">正在载入个股数据…</section></main>
<script>
const params=new URLSearchParams(location.search),code=params.get('code')||'';const $=s=>document.querySelector(s);const n=v=>Number(v||0);const f=v=>n(v).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});const safeReturn=()=>{try{const target=new URL(params.get('from')||'',location.origin);return target.origin===location.origin?`${target.pathname}${target.search}${target.hash}`:''}catch(_){return ''}};$('#backButton').onclick=()=>{if(document.referrer&&new URL(document.referrer).origin===location.origin&&history.length>1){history.back();return}location.href=safeReturn()||'../index.html#all-stocks'};
const movingAverage=(bars,days)=>bars.map((bar,index)=>index+1<days?null:bars.slice(index-days+1,index+1).reduce((sum,item)=>sum+n(item[4]),0)/days);
function chart(bars){const w=1080,h=350,p={l:54,r:18,t:18,b:28},ma={5:movingAverage(bars,5),20:movingAverage(bars,20),30:movingAverage(bars,30)},prices=[...bars.flatMap(x=>[n(x[2]),n(x[3])]),...Object.values(ma).flat().filter(v=>v!==null)],high=Math.max(...prices),low=Math.min(...prices),span=Math.max(high-low,.01),sx=(w-p.l-p.r)/bars.length,sy=v=>p.t+(high-v)/span*(h-p.t-p.b),yGrid=[0,.25,.5,.75,1].map(t=>{const y=p.t+t*(h-p.t-p.b),value=high-t*span;return `<line class="grid" x1="${p.l}" y1="${y}" x2="${w-p.r}" y2="${y}"/><text class="axis" x="4" y="${y+4}">${f(value)}</text>`}).join('');const dateStep=bars.length<=25?5:bars.length<=60?10:bars.length<=120?20:30,dateLabel=date=>`${date.slice(4,6)}/${date.slice(6,8)}`,dateTicks=bars.map((bar,index)=>{if(index%dateStep!==0&&index!==bars.length-1)return '';const x=p.l+index*sx+sx/2,anchor=index===0?'start':index===bars.length-1?'end':'middle';return `<line class="grid" x1="${x}" y1="${h-p.b}" x2="${x}" y2="${h-p.b+4}"/><text class="axis" text-anchor="${anchor}" x="${x}" y="${h-7}">${dateLabel(bar[0])}</text>`}).join('');const candles=bars.map((b,i)=>{const[o,hi,lo,cl]=[n(b[1]),n(b[2]),n(b[3]),n(b[4])],x=p.l+i*sx+sx/2,top=sy(Math.max(o,cl)),bottom=sy(Math.min(o,cl)),klass=cl>=o?'candle-up':'candle-down',bw=Math.max(2,sx*.62);return `<line class="wick ${klass}" x1="${x}" x2="${x}" y1="${sy(hi)}" y2="${sy(lo)}"/><rect class="${klass}" x="${x-bw/2}" y="${top}" width="${bw}" height="${Math.max(1,bottom-top)}"/>`}).join('');const maPaths=Object.entries(ma).map(([days,values])=>{let path='';values.forEach((value,index)=>{if(value===null)return;const x=p.l+index*sx+sx/2,y=sy(value);path+=`${path?'L':'M'}${x.toFixed(2)},${y.toFixed(2)}`});return `<path class="ma-line line-ma${days}" d="${path}"/>`}).join('');return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="日 K 线图，含五日、二十日、三十日均线">${yGrid}${candles}${maPaths}${dateTicks}</svg>`}
Promise.all([fetch('market.json').then(r=>r.json()),fetch(`history/${encodeURIComponent(code)}.json`).then(r=>r.ok?r.json():Promise.reject())]).then(([market,history])=>{const s=market.stocks.find(x=>x.code===code),bars=history.bars||[];if(!s||!bars.length)throw Error();const last=bars.at(-1),pct=n(s.pct_chg),groupKey='radar-groups';const maValue=days=>movingAverage(bars,days).at(-1);$('#app').innerHTML=`<div class="head"><div><div class="eyebrow">A-SHARE · DAILY DETAIL · ${market.as_of}</div><h1>${s.name}<span class="code">${s.code}</span></h1><div class="quote ${pct>=0?'up':'down'}">${f(s.close)}　${pct>=0?'+':''}${pct.toFixed(2)}%</div></div><button class="watch" id="watch">加入观察池</button></div><section class="card chart-card"><div class="chart-head"><h2 id="chartTitle">近 ${Math.min(120,bars.length)} 个交易日 K 线</h2><small>日线 · 原始价格数据</small></div><div class="chart-tools"><span>缩放</span><button class="zoom" data-window="20">1月</button><button class="zoom" data-window="60">3月</button><button class="zoom active" data-window="120">6月</button><button class="zoom" data-window="240">1年</button><button class="zoom" data-window="0">全部</button><div class="ma-legend"><b class="ma5">MA5 ${f(maValue(5))}</b><b class="ma20">MA20 ${f(maValue(20))}</b><b class="ma30">MA30 ${f(maValue(30))}</b></div></div><div id="chartMount" class="chart-mount" tabindex="0" aria-label="K 线图，可按住 Ctrl 或 Command 后滚动鼠标滚轮缩放"></div><div class="stats"><div><span>开盘</span><b>${f(last[1])}</b></div><div><span>最高</span><b>${f(last[2])}</b></div><div><span>最低</span><b>${f(last[3])}</b></div><div><span>成交额</span><b>${s.amount_billion} 亿</b></div><div><span>换手率</span><b>${s.turnover_rate??'-'}%</b></div></div></section><section class="card history"><h2>最近日线</h2><table><thead><tr><th>日期</th><th>开盘</th><th>最高</th><th>最低</th><th>收盘</th></tr></thead><tbody>${bars.slice(-12).reverse().map(b=>`<tr><td>${b[0]}</td><td>${f(b[1])}</td><td>${f(b[2])}</td><td>${f(b[3])}</td><td>${f(b[4])}</td></tr>`).join('')}</tbody></table></section>`;let visibleDays=Math.min(120,bars.length);const normalizeDays=value=>Math.max(20,Math.min(bars.length,Math.round(value/5)*5));const redraw=days=>{visibleDays=days===0?bars.length:normalizeDays(days);const shown=bars.slice(-visibleDays);$('#chartMount').innerHTML=`${chart(shown)}<span class="wheel-hint">Ctrl / ⌘ + 滚轮缩放</span>`;$('#chartTitle').textContent=`近 ${shown.length} 个交易日 K 线`;document.querySelectorAll('.zoom').forEach(btn=>{const target=Number(btn.dataset.window);btn.classList.toggle('active',target===0?visibleDays===bars.length:target===visibleDays)})};redraw(visibleDays);document.querySelectorAll('.zoom').forEach(btn=>btn.onclick=()=>redraw(Number(btn.dataset.window)));$('#chartMount').addEventListener('wheel',event=>{if(!event.ctrlKey&&!event.metaKey)return;event.preventDefault();const factor=event.deltaY<0?.82:1.22;redraw(normalizeDays(visibleDays*factor))},{passive:false});const button=$('#watch'),groups=JSON.parse(localStorage.getItem(groupKey)||'{}'),list=groups['观察池']||[];button.textContent=list.includes(code)?'已加入观察池':'加入观察池';button.onclick=()=>{const current=JSON.parse(localStorage.getItem(groupKey)||'{}'),saved=current['观察池']||[];current['观察池']=saved.includes(code)?saved.filter(x=>x!==code):[...saved,code];localStorage.setItem(groupKey,JSON.stringify(current));button.textContent=saved.includes(code)?'加入观察池':'已加入观察池'};}).catch(()=>$('#app').innerHTML='<p>暂未找到这只股票的历史数据，请返回个股扫描后重试。</p>');
</script><script src="direction-colors.js?v=1"></script></body></html>
