<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A股全市场</title><style>body{margin:0;padding:16px;font:14px 'Microsoft YaHei',sans-serif;color:#172b38;background:#fff}.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px}.bar input,.bar select,button{padding:8px 10px;border:1px solid #dce1db;border-radius:4px;background:#fff}.bar input{width:260px}button{cursor:pointer}table{width:100%;border-collapse:collapse}th{background:#f3f5f2;cursor:pointer}th,td{padding:9px 8px;text-align:right;border-bottom:1px solid #edf0ec}th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3){text-align:left}.up{color:#cf4e3d}.down{color:#08756f}.page{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:#69767d}@media(max-width:620px){.bar{flex-wrap:wrap}.bar input{width:100%}th:nth-child(7),td:nth-child(7),th:nth-child(8),td:nth-child(8){display:none}}</style><body><div class="bar"><input id="q" placeholder="搜索名称或代码"><select id="size"><option>50</option><option>100</option><option>200</option></select><span id="count"></span></div><table><thead><tr><th>#</th><th>股票</th><th>代码</th><th data-k="close">收盘 ↕</th><th data-k="pct_chg">涨跌幅 ↕</th><th data-k="amount_billion">成交额 ↕</th><th data-k="turnover_rate">换手率 ↕</th><th data-k="volume">成交量 ↕</th></tr></thead><tbody id="rows"></tbody></table><div class="page"><button id="prev">← 上一页</button><span id="page"></span><button id="next">下一页 →</button></div><script>let a=[],f=[],p=1,k='amount_billion',d=-1;const $=x=>document.querySelector(x);const n=x=>Number(x)||0;function draw(){let z=(p-1)*+$('#size').value,s=f.slice(z,z+(+$('#size').value));$('#rows').innerHTML=s.map((x,i)=>`<tr><td>${z+i+1}</td><td>${x.name}</td><td>${x.code}</td><td>${n(x.close).toFixed(2)}</td><td class="${n(x.pct_chg)>=0?'up':'down'}">${n(x.pct_chg)>=0?'+':''}${n(x.pct_chg).toFixed(2)}%</td><td>${n(x.amount_billion).toFixed(2)} 亿</td><td>${x.turnover_rate??'-'}%</td><td>${n(x.volume).toLocaleString()}</td></tr>`).join('');$('#count').textContent=`共 ${f.length.toLocaleString()} 只`;$('#page').textContent=`第 ${p} / ${Math.max(1,Math.ceil(f.length/+$('#size').value))} 页`}function filter(){let q=$('#q').value.toLowerCase();f=a.filter(x=>(x.name+x.code).toLowerCase().includes(q)).sort((x,y)=>d*(n(x[k])-n(y[k])));p=1;draw()}fetch('market.json').then(r=>r.json()).then(x=>{a=x.stocks;filter()});$('#q').oninput=filter;$('#size').onchange=filter;document.querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>{k=x.dataset.k;d*=-1;filter()});$('#prev').onclick=()=>{if(p>1){p--;draw()}};$('#next').onclick=()=>{if(p<Math.ceil(f.length/+$('#size').value)){p++;draw()}}</script></body></html>
