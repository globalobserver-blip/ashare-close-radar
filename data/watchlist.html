<!doctype html><meta charset="utf-8"><style>body{font:14px 'Microsoft YaHei';padding:14px;color:#172b38}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e8ebe6;text-align:left}.remove{color:#b83b30;cursor:pointer}</style><h3>观察池</h3><p id="hint">加载中…</p><table><thead><tr><th>股票</th><th>收盘</th><th>涨跌幅</th><th></th></tr></thead><tbody id="b"></tbody></table><script>const W='radar-watch',w=()=>JSON.parse(localStorage.getItem(W)||'[]');function draw(a){let x=w(),s=a.filter(i=>x.includes(i.code));document.querySelector('#hint').textContent=s.length?`共 ${s.length} 只`:'暂无自选，请在“个股扫描”点击 ☆ 添加。';document.querySelector('#b').innerHTML=s.map(i=>`<tr><td>${i.name} <small>${i.code}</small></td><td>${i.close.toFixed(2)}</td><td>${i.pct_chg.toFixed(2)}%</td><td class="remove" data-c="${i.code}">移除</td></tr>`).join('');document.querySelectorAll('.remove').forEach(e=>e.onclick=()=>{localStorage.setItem(W,JSON.stringify(w().filter(x=>x!==e.dataset.c)));draw(a)})}fetch('market.json').then(r=>r.json()).then(d=>draw(d.stocks))</script>
