<!doctype html><meta charset="utf-8"><style>body{font:15px 'Microsoft YaHei';padding:16px;color:#172b38}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e8ebe6;text-align:right}th:first-child,td:first-child{text-align:left}.up{color:#ce4c3b}.down{color:#08756f}</style><h2 id="t">行业股票池</h2><p id="m"></p><table><thead><tr><th>股票</th><th>收盘</th><th>涨跌幅</th><th>成交额</th><th>换手率</th></tr></thead><tbody id="b"></tbody></table><script>let q=new URLSearchParams(location.search).get('industry')||'';fetch('market.json').then(r=>r.json()).then(d=>{let a=d.stocks.filter(x=>x.industry===q).sort((x,y)=>y.amount_billion-x.amount_billion);t.textContent=q+' · 股票池';m.textContent=`${d.as_of} · ${a.length}只 · 按成交额排序`;b.innerHTML=a.map(x=>`<tr><td>${x.name} ${x.code}</td><td>${x.close.toFixed(2)}</td><td class="${x.pct_chg>=0?'up':'down'}">${x.pct_chg.toFixed(2)}%</td><td>${x.amount_billion}亿</td><td>${x.turnover_rate??'-'}%</td></tr>`).join('')})</script>
