<!doctype html><meta charset="utf-8"><style>body{font:15px 'Microsoft YaHei';padding:14px;color:#172b38}select,button{padding:8px;border:1px solid #dce1db;border-radius:4px;background:#fff}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:10px;border-bottom:1px solid #e8ebe6;text-align:left}a{color:#172b38;text-decoration:none;font-weight:700}a:hover{color:#08756f}.code{margin-left:7px;color:#71808a;font:12px 'Times New Roman'}.rm{color:#bd4035;cursor:pointer}</style><select id="g"><option>观察池</option><option>长期跟踪</option><option>事件关注</option></select><span id="n"></span><table><thead><tr><th>股票</th><th>收盘</th><th>涨跌幅</th><th></th></tr></thead><tbody id="b"></tbody></table><script>const $=x=>document.querySelector(x),K='radar-groups',S=()=>JSON.parse(localStorage.getItem(K)||'{}');function draw(all){const group=$('#g').value,codes=S()[group]||[],items=all.filter(item=>codes.includes(item.code));$('#n').textContent=` ${items.length}只`;$('#b').innerHTML=items.map(item=>`<tr><td><a target="_top" href="stock_detail.html?code=${encodeURIComponent(item.code)}">${item.name}</a><a target="_top" class="code" href="stock_detail.html?code=${encodeURIComponent(item.code)}">${item.code}</a></td><td>${item.close.toFixed(2)}</td><td>${item.pct_chg.toFixed(2)}%</td><td class="rm" data-c="${item.code}">移除</td></tr>`).join('')||'<tr><td colspan="4">当前分组暂无股票</td></tr>';document.querySelectorAll('.rm').forEach(button=>button.onclick=()=>{const saved=S();saved[group]=saved[group].filter(code=>code!==button.dataset.c);localStorage.setItem(K,JSON.stringify(saved));draw(all)})}fetch('market.json').then(r=>r.json()).then(data=>{$('#g').onchange=()=>draw(data.stocks);draw(data.stocks)})</script>
