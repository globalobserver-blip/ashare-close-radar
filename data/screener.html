<!doctype html><meta charset="utf-8"><style>body{font:14px 'Microsoft YaHei';padding:14px;color:#172b38}input,button{padding:8px;border:1px solid #dce1db;border-radius:4px;background:#fff}input{width:240px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:9px;border-bottom:1px solid #e8ebe6;text-align:right}th:nth-child(2),td:nth-child(2){text-align:left}.up{color:#ce4c3b}.down{color:#08756f}.star{color:#08756f;cursor:pointer}.bar{display:flex;gap:8px;align-items:center}.pager{margin-top:12px;display:flex;justify-content:space-between}</style><div class="bar"><input id="q" placeholder="搜索名称或代码"><span id="n"></span></div><table><thead><tr><th>#</th><th>股票</th><th>收盘</th><th>涨跌幅</th><th>成交额</th><th>换手率</th><th>自选</th></tr></thead><tbody id="b"></tbody></table><div class="pager"><button id="prev">←</button><span id="pg"></span><button id="next">→</button></div><script>let a=[],f=[],p=1;const $=x=>document.querySelector(x),W='radar-watch';const w=()=>JSON.parse(localStorage.getItem(W)||'[]'),save=x=>localStorage.setItem(W,JSON.stringify(x));function draw(){let z=(p-1)*50,s=f.slice(z,z+50),x=w();$('#b').innerHTML=s.map((v,i)=>`<tr><td>${z+i+1}</td><td>${v.name}<small> ${v.code}</small></td><td>${v.close.toFixed(2)}</td><td class="${v.pct_chg>=0?'up':'down'}">${v.pct_chg.toFixed(2)}%</td><td>${v.amount_billion}亿</td><td>${v.turnover_rate??'-'}%</td><td class="star" data-c="${v.code}">${x.includes(v.code)?'★':'☆'}</td></tr>`).join('');$('#n').textContent=`${f.length}只`;$('#pg').textContent=`${p}/${Math.ceil(f.length/50)}`;document.querySelectorAll('.star').forEach(e=>e.onclick=()=>{let x=w(),c=e.dataset.c;save(x.includes(c)?x.filter(i=>i!==c):[...x,c]);draw()})}function filter(){let q=$('#q').value.toLowerCase();f=a.filter(x=>(x.name+x.code).toLowerCase().includes(q));p=1;draw()}fetch('market.json').then(r=>r.json()).then(d=>{a=d.stocks;filter()});$('#q').oninput=filter;$('#prev').onclick=()=>{if(p>1){p--;draw()}};$('#next').onclick=()=>{if(p<Math.ceil(f.length/50)){p++;draw()}}</script>
